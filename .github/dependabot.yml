# Dependabot keeps dependencies patched. One npm ecosystem entry for the single package here,
# plus the GitHub Actions used by CI. Weekly, grouped so we get a few PRs to review rather than
# a flood.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Non-breaking updates batched into one PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

    # A major is an upgrade with its own work, not something to review in a PR that sits open
    # going stale. Take them deliberately instead. The trade is real: a fix that only exists in a
    # new major will not be raised here, so majors still need a look of their own now and then.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
