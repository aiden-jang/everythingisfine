name: Feeds

# Daily live-feed canary. It runs separately from verify so agency outages do not block builds.
# Unit tests validate parsers against recorded fixtures.
on:
  schedule:
    # 06:20 UTC. Off the hour, because everything else in the world is scheduled on it.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Retry transient agency failures before reporting a failed canary.
      - id: first
        continue-on-error: true
        run: pnpm run test:live
      - if: steps.first.outcome == 'failure'
        run: pnpm run test:live
