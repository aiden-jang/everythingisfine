name: Feeds

# Daily live-feed canary. It runs separately from verify so agency outages do not block builds.
# Unit tests validate parsers against recorded fixtures.
on:
  schedule:
    # 06:20 UTC. Off the hour, because everything else in the world is scheduled on it.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Retry transient agency failures before reporting a failed canary.
      - id: first
        continue-on-error: true
        run: pnpm run test:live
      - if: steps.first.outcome == 'failure'
        run: pnpm run test:live
