name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # test:heap rather than test. The heap measurement skips itself when gc is unreachable, and a
      # CI run that quietly skips its own memory gate is worse than one that does not have it.
      - run: pnpm test:heap
      - run: pnpm build

  # Auto-deploy on merge to main, only after the checks above pass.
  #
  # Needs a CLOUDFLARE_API_TOKEN repo secret with Workers Scripts:Edit. No D1 permission, because
  # there is no database and no migration step. Wrangler infers the account from the token.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-everythingisfine
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
