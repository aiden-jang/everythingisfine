name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gates
      - run: pnpm run size
      - run: pnpm run comments
      - run: pnpm run css-vars
      - run: pnpm run docs
      # An export nothing imports and a dependency nothing uses are both dead weight nobody notices.
      - run: pnpm run knip
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      # test:heap rather than test. The heap measurement skips itself when gc is unreachable, and a
      # CI run that quietly skips its own memory gate is worse than one that does not have it.
      - run: pnpm run test:heap
      - run: pnpm run build
      # After the build, because most classes here are Tailwind utilities that only exist in the
      # output once Tailwind has seen them used.
      - run: pnpm run dead-classes

  # The browser suite, which stayed out of CI while it talked to two real agencies: a quiet planet or an
  # agency doing maintenance would have failed the build for reasons that are not the code's fault.
  # `e2e/feeds.ts` serves both agencies, all five hazard feeds and the aurora, so the reason is gone.
  #
  # Its own job rather than more steps on `check`, so a WebGL failure and a type error are told apart at a
  # glance and the unit gate is not held up behind a browser download.
  #
  # `pnpm dev` rather than `EIF_BUILD=1`. Build mode exercises `dist` and is the stronger gate against a
  # bundler-only failure, but seven tests reach for `window.__globe`, which a production bundle correctly
  # does not carry - so it covers less of the product's behaviour. `test:e2e:build` stays a deliberate
  # pre-release run.
  #
  # NOT a `needs:` for deploy yet, and that is deliberate rather than an oversight. The suite load-tests
  # itself: a full parallel run on a developer machine put two design tests red that both pass in isolation
  # in 32s, and `design.spec.ts` on its own runs 27 green in 2.0m. `playwright.config.ts` now drops to one
  # worker and doubles the timeouts under CI, which should remove the contention - but a runner has fewer
  # cores and software-rendered WebGL, and none of that has been observed from here. So it runs on every
  # push and PR where its real behaviour is visible, and it is promoted to a deploy gate once it has been
  # green on a runner. Blocking deploys on an unverified browser suite is the thing this job exists to
  # stop happening.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only, because the config declares no `projects` and the default is one browser. Installing
      # all three would be three downloads to run the same tests once.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      # `test-results/`, not `playwright-report/`. The config sets `trace: "retain-on-failure"` and names no
      # HTML reporter, so traces land in the former and the latter is never created. The first CI run failed
      # three tests and uploaded nothing, which is how a red build ends up undiagnosable.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Auto-deploy on merge to main, only after both gates above pass.
  #
  # `e2e` gates this deliberately: the suite covers the claims only a browser can settle, and a deploy
  # that ships past a red one is the outcome the job exists to stop. It has not yet been green on a
  # runner, which has fewer cores and software-rendered WebGL than the machine it passes on.
  #
  # Needs a CLOUDFLARE_API_TOKEN repo secret with Workers Scripts:Edit. No D1 permission, because
  # there is no database and no migration step. Wrangler infers the account from the token.
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-everythingisfine
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
