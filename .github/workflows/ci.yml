name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs spend no more time rendering WebGL. Main deployments remain queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gates
      - run: pnpm run security:check
      - run: pnpm run size
      - run: pnpm run comments
      - run: pnpm run css-vars
      - run: pnpm run docs
      - run: pnpm run knip
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:heap
      - run: pnpm run build
      - run: pnpm run dead-classes
      - uses: actions/upload-artifact@v7
        with:
          name: production-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # One software-rendered globe per machine; shards use separate runners.
      - run: pnpm run test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # One stable required status covers every shard, even if a matrix job is cancelled.
  browser-check:
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser shard
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

  deploy:
    needs: [check, browser-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-everythingisfine
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
