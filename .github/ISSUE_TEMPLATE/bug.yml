name: Bug report
description: Report a reproducible app or repository problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior, steps to reproduce, and the relevant view or layer.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Chrome on macOS, etc.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a screenshot or shareable view URL. Remove personal data and secrets.
