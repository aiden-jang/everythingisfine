name = "everythingisfine"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Static assets and a small anonymous aggregate-events endpoint. Feed requests still go directly to their supported transports.

# Serve only on the custom domain.
workers_dev = false

[[routes]]
pattern = "everythingisfine.aidenjang.com"
custom_domain = true

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# Fall back to the SPA for stray paths. Permalink fragments stay in the browser.
not_found_handling = "single-page-application"

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

# Anonymous analytics has its own rate bucket, separate from sign-in and room actions.
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "9001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
