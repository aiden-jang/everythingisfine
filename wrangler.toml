name = "everythingisfine"
compatibility_date = "2026-08-01"

# Static hosting without a Worker script. The browser reaches the feeds directly through their supported transports.

# Serve only on the custom domain.
workers_dev = false

[[routes]]
pattern = "everythingisfine.aidenjang.com"
custom_domain = true

[assets]
directory = "dist"
# Fall back to the SPA for stray paths. Permalink fragments stay in the browser.
not_found_handling = "single-page-application"
