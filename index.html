<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <meta
      name="description"
      content="Everything the Earth is doing right now, on a globe that only moves when the data does. Two seismic feeds that disagree, and the disagreement is the point."
    />
    <title>Everything Is Fine</title>
    <link rel="icon" href="/icon-32.png?v=3" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <!-- One canonical address, so a link shared with a fragment or a stray query is not treated as a
         separate page by anything that unfurls it. -->
    <link rel="canonical" href="https://everythingisfine.aidenjang.com/" />

    <!--
      Every shared permalink used to render as a bare URL. The link is a headline feature of this app
      and it looked like nothing everywhere it was sent.

      The preview is the globe with its geography and plate boundaries and no earthquakes on it,
      composed with the wordmark and one line by `pnpm card`, which drives the real app and reads the
      real palette out of it. That script is committed now: the first card was made by one that was
      not, so it could not be rebuilt after any change to the globe, and an asset nobody can
      regenerate is one that quietly goes stale.

      Real events would be better and would also be a lie: a card is cached for days, so it would show
      a specific day's seismicity as if it were now. Section 10 forbids sample data that is not
      labelled as such, and a preview claiming yesterday's earthquakes are today's is exactly that.

      **Every link gets the same card, and that is a constraint rather than a choice.** Permalinks are
      fragment-encoded, and a fragment is never sent to a server, so nothing serving this page can know
      which view was shared. A card per share needs the state in the path and something running to
      compose it, which means a Worker, which reverses the no-`main` decision the whole deployment
      rests on. Worth reopening deliberately or not at all.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Everything Is Fine" />
    <meta property="og:title" content="Everything Is Fine" />
    <meta
      property="og:description"
      content="Everything the Earth is doing right now, on a globe that only moves when the data does. Two seismic feeds that disagree, and the disagreement is the point."
    />
    <meta property="og:url" content="https://everythingisfine.aidenjang.com/" />
    <meta property="og:image" content="https://everythingisfine.aidenjang.com/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A dark globe showing coastlines and tectonic plate boundaries across the western Pacific."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Twitter reads its own alt and ignores `og:image:alt`, so the same sentence is stated twice. -->
    <meta
      name="twitter:image:alt"
      content="A dark globe showing coastlines and tectonic plate boundaries across the western Pacific."
    />
  </head>
  <body>
    <span id="external-link-hint" hidden>Opens in a new tab</span>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
